# max-170gb: Qwen3.8-Flash-Next via omlx for 256 GB machines that also run
#            other heavy workloads (a VM, a desktop session)
# =================================================================
# Purpose
# -------
# One strong generalist instead of a coder/chat pair: Qwen3.8-Flash-Next
# (125B MoE, 6B active) codes, chats, calls tools and reads images, with a
# 262k native context. Multi-token-prediction speculative decoding is on.
# Embedder and reranker stay resident for RAG. There is no separate vision
# model — the main model is a VLM.
#
# Memory budget (256 GB machine)
# ------------------------------
# Main model (oQ4e + MTP head):            ~100 GiB
# Embedder + reranker:                     ~8 GiB
# Resident, all pinned:                    ~108 GiB
# Memory guard ceiling (memory_guard_gb):  170 GiB — soft stop at ~145,
#                                          in-flight abort at ~162
#
# The ceiling is set by macOS, not by omlx: under memory pressure jetsam
# SIGKILLs the largest process, and omlx's guard only counts Metal
# allocations. On a 256 GB machine shared with other workloads, ~188 GiB
# resident has been killed while ~175 GiB survived. 170 keeps the guard's hard
# stop below that band. On a dedicated inference box, raise it.
#
# Why each slot
# -------------
# main   — Jundot/Qwen3.8-Flash-Next-oQ4e-mtp (~106 GB on disk)
#          omlx's own mixed-precision oQ4e quant with the MTP head; `mtp:
#          true` adds ~1.5 GiB and lifts single-stream decode by roughly
#          a third. Keep MTP adaptive — a fixed draft depth measured slower
#          than no MTP. Reasoning effort defaults to `xhigh` in the chat
#          template; clients that want short answers send
#          `chat_template_kwargs: {"reasoning_effort": "low"}` (or
#          `enable_thinking: false`) in the request — a profile cannot set it.
#
# embed  — mlx-community/Qwen3-Embedding-8B-4bit-DWQ (~4 GB)
#          Same served name as every other omlx profile: knowledge bases
#          stay valid across profile switches.
#
# rerank — mlx-community/Qwen3-Reranker-4B-mxfp8 (~4 GB resident)
#          The 4B over the 0.6B: MTEB-R 69.8 vs 65.8 for ~3 GB more. Same
#          served name, no reindex.
#
# vision — none. Images go to `qwen3.8-flash-next`. This profile does NOT
#          serve `qwen3-vl-8b`, so clients hard-wired to that name need
#          reconfiguring before switching to it.
#
# max_context_window 262144 is the model's native window, measured as
# admissible under this profile's memory guard with `4lm bench --context`.
#
# Everything is pinned with no TTL: loading and unloading ~100 GB models is
# where omlx takes its emergency-reclaim path and IOGPU panics have been
# reported.
#
# Last reviewed: 2026-09-28
backend: omlx

omlx:
  memory_guard_gb: 170
  paged_ssd_cache_max_size: 50GB

models:
  - model_path: Jundot/Qwen3.8-Flash-Next-oQ4e-mtp
    served_model_name: qwen3.8-flash-next
    model_type: vlm
    mtp: true
    max_context_window: 262144
    pin: true
    ttl: null

  - model_path: mlx-community/Qwen3-Embedding-8B-4bit-DWQ
    served_model_name: qwen3-embedding
    model_type: lm
    pin: true
    ttl: null

  - model_path: mlx-community/Qwen3-Reranker-4B-mxfp8
    served_model_name: qwen3-reranker
    model_type: lm
    pin: true
    ttl: null
