# lean: light Qwen3 stack via omlx for 64 GB machines.
#       256 GB → `default`, 128 GB → `mid`.
# =================================================================
# Purpose
# -------
# Two small MoE models (3B active each, so decode stays fast) for code and
# chat, plus the shared embedder and reranker for RAG. No vision.
#
# Memory budget (64 GB machine; macOS default GPU working set ~48–55 GiB)
# -----------------------------------------------------------------------
# Qwen3-Coder-30B-A3B 4-bit:               ~17 GiB
# Qwen3.6-35B-A3B 4-bit:                   ~18 GiB
# Embedder + 0.6B reranker:                ~5 GiB
# Resident, all pinned:                    ~40 GiB
# Memory guard ceiling (memory_guard_gb):  50 GiB — soft stop at ~42,
#                                          in-flight abort at ~47
#
# That leaves little KV room: long contexts on both models at once will hit
# the guard's soft stop first, which pauses new requests rather than
# crashing. On a busy 64 GB desktop, unpinning the chat model is the lever.
#
# DERIVED, NOT MEASURED: the guard and both context caps follow from the
# working set and the model sizes above. Check them on the machine with
# `4lm bench --context` and adjust `max_context_window` to what it reports.
#
# Why each slot
# -------------
# coder  — mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit (~17 GB)
#          Same Qwen3-Coder family as the 80B in `mid`, ~25 GB lighter.
#          Aider-Polyglot ~60.9 % at 4-bit against ~61.8 % bf16.
#
# chat   — mlx-community/Qwen3.6-35B-A3B-4bit (~18 GB)
#          MoE chat model, fast decode on a small machine.
#
# embed  — mlx-community/Qwen3-Embedding-8B-4bit-DWQ (~4 GB)
#          Same served name as every omlx profile: knowledge bases stay valid.
#
# rerank — mlx-community/Qwen3-Reranker-0.6B-mxfp8 (~0.7 GB)
#
# Everything is pinned with no TTL: repeated load/unload of large models is a
# documented trigger of IOGPU kernel panics.
#
# Last reviewed: 2026-09-29
backend: omlx

omlx:
  memory_guard_gb: 50
  paged_ssd_cache_max_size: 20GB

models:
  - model_path: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    served_model_name: qwen3-coder-30b
    model_type: lm
    max_context_window: 65536
    pin: true
    ttl: null

  - model_path: mlx-community/Qwen3.6-35B-A3B-4bit
    served_model_name: qwen3.6-35b
    model_type: lm
    max_context_window: 65536
    pin: true
    ttl: null

  - model_path: mlx-community/Qwen3-Embedding-8B-4bit-DWQ
    served_model_name: qwen3-embedding
    model_type: lm
    pin: true
    ttl: null

  - model_path: mlx-community/Qwen3-Reranker-0.6B-mxfp8
    served_model_name: qwen3-reranker
    model_type: lm
    pin: true
    ttl: null
